# Verifica cada push y PR: dependencias sin vulnerabilidades conocidas, tests y build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: el workflow solo lee el repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4 # usa la versión de "packageManager" en package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm test
      - run: pnpm build
